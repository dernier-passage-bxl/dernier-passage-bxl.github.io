<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dernier Passage Bruxelles</title>
<meta name="description" content="Atlas 3D des derniers métros, trams, Noctis et trains à Bruxelles, et calcul du dernier retour possible.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Noto+Sans:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F2F2EE; --card:#FFFFFF; --soft:#F4F4F1; --ink:#2D2D2D; --ink2:#5E6166; --mute:#8C9096;
  --rule:rgba(45,45,45,.09); --accent:#E0533F; --ok:#2E9A57; --warn:#C7741F; --dead:#D2D4D8;
  --shadow:0 1px 2px rgba(20,22,28,.05),0 10px 30px rgba(20,22,28,.10);
  --num:"Inter Tight","Noto Sans",system-ui,sans-serif;
  --txt:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --panelTop:88px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120; --card:#141C2E; --soft:#1C2640; --ink:#E9ECF2; --ink2:#AEB5C4; --mute:#7F889B;
    --rule:rgba(255,255,255,.08); --accent:#F0634E; --ok:#4FC47D; --warn:#F0A04B; --dead:#283146;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120; --card:#141C2E; --soft:#1C2640; --ink:#E9ECF2; --ink2:#AEB5C4; --mute:#7F889B;
  --rule:rgba(255,255,255,.08); --accent:#F0634E; --ok:#4FC47D; --warn:#F0A04B; --dead:#283146;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--txt);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}

#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}

/* étiquettes 3D */
.lbl-st{transform:translateY(-16px);background:var(--card);border-radius:6px;padding:3px 7px 3px;text-align:center;line-height:1.1;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.14);transition:opacity .25s}
.lbl-st b{display:block;font-size:11.5px;font-weight:700;color:var(--ink)}
.lbl-st i{display:block;font-style:normal;font-family:var(--num);font-size:8px;font-weight:700;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.lbl-st.fade{opacity:.28}
.lbl-com{font-family:var(--num);font-size:10.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);opacity:.75;white-space:nowrap}
.lbl-ax{font-family:var(--num);font-size:13px;font-weight:800;color:var(--ink2);transform:translateX(24px)}
.lbl-now{font-family:var(--num);background:var(--accent);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px;transform:translateX(-34px)}
.lbl-floor{font-size:13px;font-weight:900;letter-spacing:.2em;color:var(--ink2);text-transform:uppercase;white-space:nowrap}

/* marque */
#brand{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;display:flex;align-items:center;gap:12px;padding:14px 20px 14px 14px;z-index:5}
#brand svg{width:46px;height:46px;flex:none;color:var(--ink)}
#brand svg text{font-family:var(--num);font-weight:900;font-size:13px;fill:currentColor}
#brand h1{margin:0;font-size:21px;font-weight:900;letter-spacing:.05em;line-height:1.15;font-family:var(--num)}
.brand-en{font-family:var(--num);font-size:10.5px;font-weight:700;letter-spacing:.28em;color:var(--mute);margin-top:3px}
.brand-count{display:none;font-family:var(--num);color:var(--ink2);font-size:12px;margin-left:10px;gap:4px;align-items:baseline}
.brand-count b{font-size:17px;font-weight:800;color:var(--ink);margin-left:6px}
@media (min-width:1500px){.brand-count{display:flex}}

/* contrôles */
#controls{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;left:380px;display:flex;gap:10px;z-index:6;flex-wrap:wrap;justify-content:flex-end;pointer-events:none}
#controls>*{pointer-events:auto}
.seg{display:flex;padding:5px;gap:2px;border-radius:999px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 11px;font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.icon-btn{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);flex:none;color:var(--ink);font-family:var(--num);font-weight:900;font-size:13px}
.icon-btn svg{width:21px;height:21px}
.icon-btn[aria-expanded="true"]{background:var(--ink);color:var(--card)}

/* panneau liste */
#listPanel{position:fixed;left:16px;top:calc(106px + env(safe-area-inset-top,0px));bottom:calc(132px + env(safe-area-inset-bottom,0px));width:310px;display:flex;flex-direction:column;overflow:hidden;z-index:4}
.panel-head{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:0 12px;border:2px solid transparent}
.search:focus-within{border-color:var(--ink);background:var(--card)}
.search svg{width:17px;height:17px;color:var(--mute);flex:none}
#q{flex:1;border:0;background:transparent;outline:0;padding:10px 0;font-size:14px;min-width:0}
#qClear{border:0;background:transparent;color:var(--ink2);font-weight:900;padding:4px;display:none}
.sort{display:flex;gap:6px;flex-wrap:wrap}
.sort button{border:0;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink2)}
.sort button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.panel-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:8px}
.group-head{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;color:var(--ink2);padding:14px 16px 6px}
.group-head::after{content:"";flex:1;height:1px;background:var(--rule)}
.row{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:10px 16px 12px}
.row:hover{background:var(--soft)}
.row[aria-current="true"]{background:var(--soft)}
.row[aria-current="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lc)}
.row-name{display:block;font-weight:700;font-size:14px;line-height:1.25}
.row-sub{display:block;font-size:11.5px;color:var(--mute);line-height:1.35;margin-top:1px}
.row-time{text-align:right;line-height:1.1}
.row-time b{display:block;font-family:var(--num);font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.row-time span{display:block;font-size:11px;font-weight:700;color:var(--ok);margin-top:2px;white-space:nowrap}
.row-time span.run{color:var(--warn)}
.row.done .row-time b,.row.done .row-name{color:var(--mute)}
.row.done .row-time span{color:var(--mute)}
.row-bar{grid-column:2/4;height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:-4px}
.row-bar i{display:block;height:100%;background:var(--lc);border-radius:2px}
.badge{width:34px;height:34px;border-radius:50%;border:4px solid var(--lc);box-sizing:border-box;display:grid;place-items:center;font-family:var(--num);font-weight:900;font-size:12px;color:var(--ink);background:var(--card);flex:none;letter-spacing:-.03em}
.badge.sm{width:24px;height:24px;border-width:3px;font-size:9.5px}
.badge.lg{width:52px;height:52px;border-width:6px;font-size:16px}
.badge.st{--lc:var(--ink)}

/* panneaux de droite */
.side{position:fixed;right:16px;top:var(--panelTop);bottom:calc(132px + env(safe-area-inset-bottom,0px));width:350px;display:flex;flex-direction:column;overflow:hidden;z-index:5}
.side[hidden]{display:none}
#detail{border-top:6px solid var(--lc,var(--ink))}
.d-head{position:relative;padding:18px 18px 14px;border-bottom:1px solid var(--rule)}
.d-title{display:flex;align-items:center;gap:14px;padding-right:40px}
.d-title h2{margin:0;font-size:21px;font-weight:900;line-height:1.2}
.d-en{font-family:var(--num);font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;margin-top:2px}
.d-meta{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.chip{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;color:var(--ink2);border:0}
button.chip{cursor:pointer}
button.chip:hover{color:var(--ink)}
.x-btn{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center}
.x-btn svg{width:14px;height:14px}
.d-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 18px}
.d-sec{font-size:12px;font-weight:700;color:var(--ink2);margin:16px 2px 10px}
.dir{background:var(--soft);border-radius:14px;padding:14px 14px 4px;margin-bottom:12px}
.dir-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:8px}
.dir-h b{font-size:15px;font-weight:900;line-height:1.3}
.dir-h span{font-size:11.5px;color:var(--ink2);text-align:right;line-height:1.4}
.dep{border-top:1px solid var(--rule);padding:10px 0}
.dep-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dep-top span{font-weight:700;font-size:13.5px}
.dep-top span small{font-weight:500;color:var(--ink2);font-size:11px;margin-left:3px}
.dep-top b{font-family:var(--num);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.dep-to{font-size:11.5px;color:var(--ink2);margin-top:1px}
.dep-to strong{color:var(--ink);font-weight:700}
.dep-full{margin-top:8px;background:var(--card);border-radius:8px;padding:6px 9px;font-size:11px;color:var(--ink2)}
.dep-full b{color:var(--ink)}
.dep.gone .dep-top b,.dep.gone .dep-top span{color:var(--mute)}
.tt{width:100%;border-collapse:collapse;font-size:12.5px}
.tt th{font-size:11px;font-weight:700;color:var(--mute);text-align:right;padding:6px 4px;border-bottom:1px solid var(--rule)}
.tt th:first-child{text-align:left}
.tt td{padding:7px 4px;border-bottom:1px solid var(--rule);text-align:right;vertical-align:top}
.tt td:first-child{text-align:left;font-weight:700}
.tt td[data-station]{cursor:pointer}
.tt td[data-station]:hover{color:var(--accent)}
.tt td b{display:block;font-family:var(--num);font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}
.tt td small{display:block;font-size:10.5px;color:var(--mute);white-space:nowrap}
.tt td.gone b{color:var(--mute);font-weight:600}
.tt td.best b{color:var(--ok)}
.src{font-size:11px;color:var(--mute);line-height:1.6;margin-top:16px}
.src a{color:inherit}
.sline{background:var(--soft);border-radius:14px;padding:12px 14px 6px;margin-bottom:10px}
.sline-h{display:flex;align-items:center;gap:10px;font-weight:900;font-size:14.5px;padding-bottom:8px;border:0;background:transparent;width:100%;text-align:left;padding-left:0}
.sdep{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--rule);padding:8px 0}
.sdep span{font-size:12px;color:var(--ink2)}
.sdep b{font-family:var(--num);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.sdep.gone b{color:var(--mute)}
.daybar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.daybar div{background:var(--soft);border-radius:10px;padding:7px 8px;text-align:center}
.daybar div small{display:block;font-size:10.5px;color:var(--ink2);font-weight:700}
.daybar div b{font-family:var(--num);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.daybar div.cur{outline:2px solid var(--ink)}

/* itinéraire */
.pform{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pform label{display:block;font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.pform input{width:100%;box-sizing:border-box;border:2px solid transparent;background:var(--soft);border-radius:10px;padding:9px 10px;font-size:14px;outline:0}
.pform input:focus{border-color:var(--ink);background:var(--card)}
#pSwap{grid-row:1/3;grid-column:2;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;align-self:center}
#pSwap svg{width:16px;height:16px}
#pGo{margin-top:10px;width:100%;height:42px;border:0;border-radius:999px;background:var(--ink);color:var(--card);font-weight:800}
.presult{margin-top:14px}
.pbig{background:var(--soft);border-radius:14px;padding:14px}
.pbig small{display:block;font-size:11.5px;color:var(--ink2);font-weight:700}
.pbig b{display:block;font-family:var(--num);font-size:38px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.pbig p{font-size:12.5px;margin-top:4px}
.pbig p.ok{color:var(--ok);font-weight:700}
.pbig p.late{color:var(--accent);font-weight:700}
.leg{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.leg .lt{font-size:13px;font-weight:700;line-height:1.3}
.leg .lt small{display:block;font-weight:500;color:var(--ink2);font-size:11.5px}
.leg .tm{font-family:var(--num);font-weight:800;text-align:right;line-height:1.25;font-variant-numeric:tabular-nums}
.leg .tm small{display:block;color:var(--mute);font-weight:600}
.walk{width:24px;height:24px;display:grid;place-items:center;color:var(--ink2)}
.walk svg{width:18px;height:18px}
.far{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:baseline;font-size:13px}
.far span{padding:6px 0;border-bottom:1px solid var(--rule)}
.far b{font-family:var(--num);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;padding:6px 0;border-bottom:1px solid var(--rule)}
.far small{color:var(--mute);font-size:11px;padding:6px 0;border-bottom:1px solid var(--rule)}
.far button{border:0;background:transparent;padding:6px 0;text-align:left;font-weight:600;border-bottom:1px solid var(--rule);cursor:pointer}
.far button:hover{color:var(--accent)}

/* comparaison */
.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp th{font-size:11px;color:var(--mute);font-weight:700;padding:6px 4px;text-align:right;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--card)}
.cmp th:first-child{text-align:left}
.cmp td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--rule);font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}
.cmp td:first-child{text-align:left;font-family:var(--txt)}
.cmp td.late{color:var(--ok);font-weight:900}
.cmp td.none{color:var(--mute);font-weight:500}
.cmp tr.grp td{font-family:var(--txt);font-size:11px;font-weight:700;color:var(--ink2);padding-top:14px}
.cmp .lname{display:flex;align-items:center;gap:8px;font-weight:700}

/* légende carte des heures */
#legend{position:fixed;right:16px;bottom:calc(132px + env(safe-area-inset-bottom,0px));padding:12px 16px 10px;z-index:4;width:280px;box-sizing:border-box}
#legend[hidden]{display:none}
#legend p{font-size:12px;font-weight:700;margin-bottom:8px}
#legendBar{height:10px;border-radius:5px}
#legendTicks{position:relative;height:16px;margin-top:4px}
#legendTicks span{position:absolute;transform:translateX(-50%);font-family:var(--num);font-size:11px;color:var(--ink2);font-weight:600}
#legend small{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);margin-top:4px}
#legend small i{display:inline-block;width:18px;height:4px;border-radius:2px;background:var(--dead)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;z-index:9;white-space:nowrap;transform:translate(12px,-120%)}
#tip[hidden]{display:none}
#tip b{font-family:var(--num)}

/* barre horaire */
#timebar{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:100px;box-sizing:border-box;display:grid;grid-template-columns:200px 1fr auto;gap:28px;align-items:center;padding:0 22px;border-radius:24px;z-index:6}
.clock-label{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.clock-time{font-family:var(--num);font-size:46px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.track-wrap{min-width:0}
#track{position:relative;height:34px;margin:0 12px;cursor:pointer;touch-action:none}
.track-band{position:absolute;left:-12px;right:-12px;top:11px;height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.track-fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:999px}
.tick{position:absolute;top:17px}
.tick i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--ink);box-sizing:border-box}
.tick.minor i{left:-2.5px;top:-2.5px;width:5px;height:5px;border:0;background:var(--card)}
.tick.after i{border-color:var(--mute)}
.tick.minor.after i{background:var(--mute)}
.tick span{position:absolute;top:14px;transform:translateX(-50%);font-family:var(--num);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
#knob{position:absolute;top:17px;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--card);border:5px solid var(--accent);box-sizing:border-box;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
#status{font-size:12px;color:var(--ink2);text-align:center;margin-top:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status b{color:var(--ink);font-weight:700}
.tb-buttons{display:flex;gap:10px;align-items:center}
#play{width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--card);display:grid;place-items:center}
#play svg{width:15px;height:15px}
.pill{height:44px;border:2px solid var(--ink);background:transparent;border-radius:999px;padding:0 18px;font-weight:800;font-size:13px;white-space:nowrap}

#hint{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);border-radius:18px;padding:12px 22px;font-size:13px;font-weight:700;text-align:center;line-height:1.6;z-index:7;cursor:pointer;transition:opacity .4s;max-width:calc(100% - 32px);box-sizing:border-box}
#hint.hide{opacity:0;pointer-events:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:700;color:var(--ink2);z-index:2}
#help ul{margin:0;padding-left:18px;line-height:1.7;font-size:13px}
#help li{margin-bottom:8px}
.pad{padding:18px 18px}
.pad h2{margin:0 0 12px;font-size:18px;font-weight:900}

#listToggle{display:none}

@media (max-width:1100px){ #controls{left:16px;top:calc(104px + env(safe-area-inset-top,0px));justify-content:flex-start} #listPanel{top:calc(214px + env(safe-area-inset-top,0px))} }
@media (max-width:900px){
  #brand{top:calc(10px + env(safe-area-inset-top,0px));left:10px;padding:8px 14px 8px 8px;gap:8px}
  #brand svg{width:34px;height:34px}
  #brand h1{font-size:15px}
  .brand-en{font-size:8px;letter-spacing:.18em}
  #controls{top:calc(66px + env(safe-area-inset-top,0px));left:10px;right:10px;gap:6px}
  .seg{padding:3px}
  .seg button{padding:6px 8px;font-size:11.5px}
  .icon-btn{width:38px;height:38px;font-size:11px}
  #listToggle{display:grid;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:10px;z-index:6}

  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Brussels", hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23" }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  let x = +p.hour * 60 + +p.minute, wd = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday);
  if (x < 240) { x += 1440; wd = (wd + 6) % 7; }
  return { t: x, day: wd === 0 ? "dimanche" : wd === 6 ? "samedi" : wd === 5 ? "vendredi" : "semaine" };
}
$("#nowBtn").addEventListener("click", () => {
  const n = brussels(); state.day = n.day; store.set("day", n.day); setPressed("[data-day]", "day", n.day);
  updatePositions(); lastMin = -1; setTime(n.t, true); refreshPanels();
  if (n.t < T_MIN) say(t("nowEarly")(fmt(n.t), fmt(T_MIN)));
  else if (n.t > T_MAX) say(t("nowLate")(fmt(n.t)));
});

// ---------------------------------------------------------------- boucle
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.fov = w < 700 ? 50 : 36; camera.updateProjectionMatrix();
  for (const m of lineMats) m.resolution.set(w, h);
  const cb = $("#controls").getBoundingClientRect();
  document.documentElement.style.setProperty("--panelTop", Math.round(cb.bottom + 12) + "px");
}
addEventListener("resize", resize);
let frameNo = 0;
function declutter() {
  const kept = [];
  for (const el of [...labelled.map((S) => S.lblEl), ...COMMUNES.map((c) => c.e)]) {
    const r = el.getBoundingClientRect();
    const hit = r.width === 0 || kept.some((k) => r.left < k.right + 4 && r.right > k.left - 4 && r.top < k.bottom + 2 && r.bottom > k.top - 2);
    el.style.visibility = hit ? "hidden" : "";
    if (!hit) kept.push(r);
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!innerWidth || !innerHeight) return;
  if (laneMat.resolution.x !== innerWidth || laneMat.resolution.y !== innerHeight) resize();
  if (camAnim) camAnim(now);
  controls.update();
  let moved = false;
  for (const k in W) { const d = WT[k] - W[k]; if (d !== 0) { W[k] = Math.abs(d) < 1e-3 || REDUCED ? WT[k] : W[k] + d * 0.12; moved = true; } }
  const dist = camera.position.distanceTo(controls.target);
  pxPerKm = innerHeight / (2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  const lanePx = Math.max(2.3, Math.min(10, 0.085 * pxPerKm));
  laneMat.linewidth = lanePx;
  const newOff = lanePx / 2 / pxPerKm;
  if (Math.abs(newOff - offKm) / offKm > 0.04) { offKm = newOff; moved = true; }
  stopMat.size = Math.max(3.5, Math.min(17, 0.19 * pxPerKm));
  trains.m.size = Math.max(14, Math.min(34, 0.5 * pxPerKm));
  trails.m.size = trains.m.size * 0.55;
  if (moved) { updatePositions(); updateColors(); }
  if (state.playing) {
    const dt = Math.min(100, now - lastFrame); lastFrame = now;
    const nt = state.t + dt / 75;   // 1 minute toutes les 75 ms : la soirée défile en ~30 s
    if (nt >= T_MAX) { setTime(T_MAX); stopPlay(); } else setTime(nt);
  }
  if (bloom.enabled) composer.render(); else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if (++frameNo % 6 === 0) declutter();
}

// ---------------------------------------------------------------- démarrage
setPressed("[data-day]", "day", state.day); setPressed("[data-view]", "view", state.view); setPressed("[data-sort]", "sort", state.sort);
$("#legend").hidden = state.view !== "heat";
resize(); applyLang(); applyTheme(); drawTime();
if (store.get("hint", false)) hint.classList.add("hide"); else { store.set("hint", true); hint.innerHTML = t("hint"); setTimeout(() => hint.classList.add("hide"), 10000); }
// lien direct : #M1, #T7, #N06, #S1 ou #nom-d-arret
function openFromHash() {
  const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  if (!h) return;
  const li = lines.findIndex((L) => L.id.toLowerCase() === h);
  if (li >= 0) { if (state.sel !== li) selectLine(li); }
  else if (bySlug.has(h) && state.station !== bySlug.get(h).fr) selectStation(bySlug.get(h).fr);
}
openFromHash();
addEventListener("hashchange", openFromHash);
$("#loading").remove();
requestAnimationFrame(frame);
</script>
